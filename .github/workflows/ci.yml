name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar imagem após testes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Conferir formatação
        run: npm run format:check
      - name: Conferir TypeScript
        run: npm run typecheck
      - name: Iniciar MongoDB e Dragonfly de teste
        run: docker compose -p qroke-tests -f compose.test.yml up -d --wait
      - name: Testes de persistência e concorrência
        run: npm run test:storage
      - name: Testes unitários
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Testes de integração
        run: npm run test:integration
      - name: Testes com duas instâncias
        run: npm run test:distributed
      - name: Dez festas e duzentos participantes simultâneos
        run: npm run test:load
      - name: Instalar Chromium e bibliotecas do sistema
        run: npx playwright install --with-deps chromium --only-shell
      - name: Testes de navegador
        run: npm run test:browser
      - name: Guardar capturas dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publicar imagem por commit
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label org.opencontainers.image.source=https://github.com/nwxdev/qroke --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "ghcr.io/nwxdev/qroke:$GITHUB_SHA" .
          docker push "ghcr.io/nwxdev/qroke:$GITHUB_SHA"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: prod
    concurrency:
      group: qroke-production
      cancel-in-progress: false
    steps:
      - name: Atualizar QRoke em produção
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/qroke-ci
          chmod 600 ~/.ssh/qroke-ci
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/qroke-ci -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "release $GITHUB_SHA $GITHUB_ACTOR"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://qroke.com.br/api/health
